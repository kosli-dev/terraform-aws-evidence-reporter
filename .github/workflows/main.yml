name: upload-package

on:
  repository_dispatch:
    types: [upload-package]


jobs:
  # @main because lambda-package-publisher trusts only that branch of the workflow.
  build:
    uses: kosli-dev/tf/.github/workflows/build-lambda.yml@main
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    with:
      package_name: evidence-reporter
      source_path: deployment
      python_version: "3.11"
      bundle_kosli_cli: true
      bundled_kosli_cli_version: ${{ github.event.client_payload.kosli_cli_tag }}
    secrets:
      kosli_api_token: ${{ secrets.KOSLI_API_TOKEN_PROD }}
      kosli_github_token: ${{ secrets.GITHUB_TOKEN }}
      policies_token: ${{ secrets.SDLC_POLICIES_CROSS_REPO_READ_TOKEN }}

  upload-package:
    needs: [build]
    runs-on: ubuntu-24.04
    outputs:
      kosli_cli_version: ${{ steps.upload-package.outputs.kosli_cli_version }}
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: ${{ needs.build.outputs.artifact_name }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::${{ secrets.KOSLI_REPORTER_SOURCES_AWS_ACCOUNT_ID }}:role/${{ github.event.repository.name }}
        aws-region: ${{ secrets.KOSLI_REPORTER_SOURCES_AWS_REGION }}
        role-duration-seconds: 900
        role-session-name: ${{ github.event.repository.name }}

    # The zip Kosli attested, so every function deployed from the release runs
    # the build trail's fingerprint.
    - name: Upload Evidence Reporter lambda package
      id: upload-package
      env:
        TAG: ${{ github.event.client_payload.kosli_cli_tag }}
      run: |
        echo "kosli_cli_version=${TAG:1}" >> $GITHUB_OUTPUT
        aws s3 cp package.zip s3://${{ secrets.KOSLI_REPORTER_SOURCES_S3_NAME }}/evidence_reporter_${TAG}.zip

  deploy-evidence-reporters:
    runs-on: ubuntu-24.04
    needs: [upload-package]
    steps:
      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.KOSLI_REPORTER_REPO_ACCESS_TOKEN }}
          repository: kosli-dev/terraform-evidence-reporter
          event-type: deploy-evidence-reporter
          client-payload: '{"kosli_cli_version": "${{ needs.upload-package.outputs.kosli_cli_version }}"}'
